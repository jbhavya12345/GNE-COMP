<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Forests</title>
  <style>
    *{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

#header{
  display: flex;
  background: rgb(2, 56, 2);
  color: white;
  justify-content: space-between;
  padding: 15px 30px;
}

#logoContainer{
  display: flex;
  gap: 10px;
  align-items: center;
}
#logo{
  display: inline-block;
}
#logo img{
  height: 70px;
}
#name{
  font-size: 23px;
  font-weight: 700;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
#navbar{
  display: flex;
  align-items: center;
}
#navbar ul{
  display: flex;
  gap: 30px;
}
#navbar ul li{
  list-style-type: none;
  font-size: 17px;
  font-weight: 600;
  

}

  </style>
</head>
<body>
  <div id="header">
    <div id="logoContainer">
      <div id="logo"><img src="logo.jfif" alt=""></div>
      <div id="name">Forest Company</div>
    </div>
    <div id="navbar">
      <ul>
        <li>Home</li>
        <li>About Us</li>
        <li>Contact Us</li>
        <li>Support</li>
      </ul>
    </div>
  </div>
</body>
</html>
